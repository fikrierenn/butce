<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>SpendMe - Akıllı Bütçe Takibi</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#8fc933" />
    <meta name="msapplication-TileColor" content="#8fc933" />
    
    <!-- App Info -->
    <meta name="description" content="Yapay zeka destekli kişisel bütçe takip uygulaması" />
    <meta name="application-name" content="SpendMe" />
    <meta name="apple-mobile-web-app-title" content="SpendMe" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/180/budget.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="https://img.icons8.com/fluency/152/budget.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/fluency/180/budget.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="https://img.icons8.com/fluency/167/budget.png" />
    
    <!-- iOS Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://img.icons8.com/fluency/32/budget.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://img.icons8.com/fluency/16/budget.png" />
    <!-- Geist Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'media', // dark class'ı asla eklenmiyor (ThemeContext disabled)
        theme: {
          extend: {
            fontFamily: {
              sans: ['Geist', 'system-ui', '-apple-system', 'sans-serif'],
            },
            colors: {
              brand: {
                50:  '#f3fbe3',
                100: '#e6f7c4',
                200: '#d4f09a',
                300: '#c2e870',
                400: '#aadd4a',
                500: '#8fc933',
                600: '#6fa821',
                700: '#568318',
                800: '#3f6110',
                900: '#2a420a',
                950: '#0f1a03',
              },
              surface: {
                dark: '#0f1a10',
                soft: '#f8fbf1',
              },
              accent: {
                400: '#fb923c',
                500: '#f97316',
                600: '#ea580c',
              },
            },
            boxShadow: {
              'card': '0 2px 8px -2px rgb(111 168 33 / 0.08), 0 1px 3px -1px rgb(111 168 33 / 0.06)',
              'card-hover': '0 8px 24px -6px rgb(111 168 33 / 0.15), 0 4px 10px -4px rgb(111 168 33 / 0.08)',
              'modal': '0 20px 60px -12px rgb(0 0 0 / 0.25)',
              'nav': '0 -4px 20px -2px rgb(15 26 16 / 0.08)',
              'fab': '0 10px 28px -6px rgb(143 201 51 / 0.6)',
            },
            animation: {
              'fade-in': 'fadeIn 200ms ease-out',
              'slide-up': 'slideUp 350ms cubic-bezier(0.16, 1, 0.3, 1)',
              'scale-in': 'scaleIn 250ms cubic-bezier(0.16, 1, 0.3, 1)',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { opacity: '0', transform: 'translateY(24px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              scaleIn: { '0%': { opacity: '0', transform: 'scale(0.92)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
            },
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

      /* Glass card effect */
      .glass { background: rgba(255,255,255,0.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

      /* Safe area insets for iOS */
      .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }

      /* Nav indicator */
      .nav-indicator { position: relative; }
      .nav-indicator::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%) scaleX(0);
        width: 20px;
        height: 3px;
        background: #8fc933;
        border-radius: 3px;
        transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .nav-indicator.active::after { transform: translateX(-50%) scaleX(1); }

      /* Page background */
      body { background: #f3fbe3; }
      html.dark body { background: #0f1a10; }

      /* Card hover interaction */
      .card-interactive { transition: box-shadow 200ms ease, transform 200ms ease; }
      .card-interactive:active { transform: scale(0.98); }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-chartjs-2": "https://esm.sh/react-chartjs-2@5.2.0",
    "chart.js": "https://esm.sh/chart.js@4.4.2",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.8",
    "@google/genai": "https://esm.sh/@google/genai@0.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    
    <!-- PWA Service Worker -->
    <script>
      // Türkçe Açıklama:
      // Service Worker'ı kaydet - offline çalışma ve cache için
      // Not: Service Worker sadece HTTPS veya localhost'ta çalışır
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('✅ Service Worker kaydedildi:', registration.scope);
            })
            .catch((error) => {
              console.log('❌ Service Worker kaydedilemedi:', error);
            });
        });
      }

      // PWA kurulum prompt'unu yakala
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('💾 PWA kurulumu mevcut');
      });

      // PWA kurulum fonksiyonu (isteğe bağlı UI'da kullanılabilir)
      window.installPWA = () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('✅ Kullanıcı PWA kurulumunu kabul etti');
            }
            deferredPrompt = null;
          });
        }
      };
    </script>
  </body>
</html>
