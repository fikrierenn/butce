<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendMe - İletişim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Geist', 'system-ui', 'sans-serif'] }, colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e' } } } } }
    </script>
</head>
<body class="bg-slate-50 font-sans">
    <header class="bg-gradient-to-r from-brand-600 to-brand-700 py-4 px-6">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <a href="index.html" class="text-white font-bold text-lg">← SpendMe</a>
        </div>
    </header>
    <main class="max-w-3xl mx-auto px-6 py-12">
        <h1 class="text-3xl font-bold text-slate-900 mb-4">İletişim</h1>
        <p class="text-slate-500 mb-10">Sorularınız, önerileriniz veya geri bildirimleriniz için bize ulaşın.</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                <div class="w-12 h-12 bg-brand-50 rounded-xl flex items-center justify-center text-xl mb-4">📧</div>
                <h3 class="text-base font-semibold text-slate-800 mb-1">E-posta</h3>
                <a href="mailto:info@spendmeapp.com" class="text-sm text-brand-600 hover:underline">info@spendmeapp.com</a>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                <div class="w-12 h-12 bg-brand-50 rounded-xl flex items-center justify-center text-xl mb-4">💬</div>
                <h3 class="text-base font-semibold text-slate-800 mb-1">Sosyal Medya</h3>
                <div class="flex gap-3 mt-2">
                    <a href="#" class="text-sm text-slate-500 hover:text-brand-600 transition-colors">Twitter</a>
                    <a href="#" class="text-sm text-slate-500 hover:text-brand-600 transition-colors">Instagram</a>
                    <a href="#" class="text-sm text-slate-500 hover:text-brand-600 transition-colors">TikTok</a>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100">
            <h2 class="text-lg font-semibold text-slate-800 mb-6">Bize Yazın</h2>
            <form class="space-y-4" onsubmit="event.preventDefault(); alert('Mesajınız gönderildi! En kısa sürede dönüş yapacağız.');">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Adınız</label>
                    <input type="text" required placeholder="Adınız Soyadınız" class="w-full px-3.5 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">E-posta</label>
                    <input type="email" required placeholder="ornek@email.com" class="w-full px-3.5 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Konu</label>
                    <select class="w-full px-3.5 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition-all">
                        <option>Genel Soru</option>
                        <option>Hata Bildirimi</option>
                        <option>Özellik Önerisi</option>
                        <option>İş Birliği</option>
                        <option>Diğer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Mesajınız</label>
                    <textarea rows="4" required placeholder="Mesajınızı yazın..." class="w-full px-3.5 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition-all resize-none"></textarea>
                </div>
                <button type="submit" class="w-full py-3 bg-brand-600 text-white text-sm font-semibold rounded-xl hover:bg-brand-700 active:bg-brand-700 transition-colors shadow-sm">
                    Gönder
                </button>
            </form>
        </div>
    </main>
</body>
</html>
