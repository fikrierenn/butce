name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'landing/**'
      - '*.md'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Auto-generate version.json from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat > public/version.json << VEOF
          {
            "version": "$VERSION",
            "build": ${{ github.run_number }},
            "minVersion": "1.0.0",
            "releaseNotes": "SpendMe v$VERSION",
            "apkUrl": "https://github.com/fikrierenn/butce/releases/download/latest/spendme.apk",
            "forceUpdate": false
          }
          VEOF
          echo "Generated version.json with version $VERSION"

      - name: Build web assets
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Update version.json in repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          git add public/version.json
          git diff --cached --quiet || git commit -m "chore: auto-update version.json to $VERSION"
          git push || true

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: |
          sudo apt-get install -y librsvg2-bin

          # Generate launcher icons
          rsvg-convert -w 48 -h 48 assets/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 assets/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 assets/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 assets/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 assets/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # Round icons (same as regular for now)
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # Foreground icons (for adaptive icons)
          rsvg-convert -w 48 -h 48 assets/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          rsvg-convert -w 72 -h 72 assets/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          rsvg-convert -w 96 -h 96 assets/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          rsvg-convert -w 144 -h 144 assets/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png

          # Adaptive icon XML'i kaldır - doğrudan PNG kullanılsın
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rsvg-convert -w 192 -h 192 assets/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Fix Kotlin stdlib conflict
        run: |
          sed -i '/^dependencies {/i configurations.all {\n    exclude group: '\''org.jetbrains.kotlin'\'', module: '\''kotlin-stdlib-jdk7'\''\n    exclude group: '\''org.jetbrains.kotlin'\'', module: '\''kotlin-stdlib-jdk8'\''\n}' android/app/build.gradle

      # Türkçe Açıklama:
      # androidx.browser 1.9.0 compileSdk 36 + AGP 8.9.1 istiyor ama Capacitor 8
      # halen compileSdk 35 + AGP 8.7.2 kullanıyor. 1.8.0'a force pin'liyoruz;
      # Capacitor compileSdk'yi bump edince bu step silinebilir.
      - name: Pin androidx.browser to 1.8.0 (AGP 8.7.2 uyumlu)
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'androidx.browser:browser:1.8.0'
              }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create consistent debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=SpendMe, OU=App, O=SpendMe, L=Istanbul, C=TR"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/spendme.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spendme-debug-apk
          path: android/app/build/outputs/apk/debug/spendme.apk
          retention-days: 30

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SpendMe Latest
          body: |
            SpendMe en son sürüm.
            Otomatik olarak oluşturuldu.
          files: android/app/build/outputs/apk/debug/spendme.apk
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
